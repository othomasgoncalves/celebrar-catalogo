spring.application.name=celebrarcatalog

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never

# Os valores abaixo sao o padrao do `docker compose up postgres` para desenvolvimento
# local. Em producao sobrescreva as tres variaveis de ambiente: nenhum ambiente exposto
# deve rodar com a credencial que esta versionada aqui.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/celebrarcatalog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:celebrarcatalog}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:celebrarcatalog}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiracao=8h
# false em dev local (HTTP); true em producao, atras de HTTPS.
app.jwt.cookie-secure=false
app.jwt.cookie-nome=celebrar_sessao

app.imagens.diretorio=${APP_IMAGENS_DIRETORIO:dados/imagens}

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

spring.jackson.deserialization.fail-on-unknown-properties=true
