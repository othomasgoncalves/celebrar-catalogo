spring.application.name=celebrarcatalog

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.url=jdbc:postgresql://localhost:5432/celebrarcatalog
spring.datasource.username=celebrarcatalog
spring.datasource.password=celebrarcatalog

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiracao=8h
# false em dev local (HTTP); true em producao, atras de HTTPS.
app.jwt.cookie-secure=false
app.jwt.cookie-nome=celebrar_sessao
